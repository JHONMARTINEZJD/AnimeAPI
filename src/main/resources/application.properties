spring.application.name=AnimeAPI

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/animedb
spring.datasource.username=anime_api
spring.datasource.password=00000000
spring.datasource.driver-class-name=org.postgresql.Driver

# Datasource desde variables de entorno
# spring.datasource.url=${SPRING_DATASOURCE_URL}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=MySuperSecretKeyThatIsAtLeast64CharactersLongForHS512Encryption12345
app.jwt.expiration=86400000

# Server Configuration
server.port=8080