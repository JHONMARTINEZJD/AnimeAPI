spring.application.name=AnimeAPI

# Database Configuration
# Los valores por defecto son solo para desarrollo local; en producción se pasan por variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/animedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:anime_api}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:00000000}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MySuperSecretKeyThatIsAtLeast64CharactersLongForHS512Encryption12345}
app.jwt.expiration=86400000

# Server Configuration
server.port=${PORT:8080}